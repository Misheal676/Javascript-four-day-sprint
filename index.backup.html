<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Focus Board</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Focus Board</h1>
  </header>

  <main>
    <form id="task-form" novalidate>
      <label for="task-title">Task title</label>
      <input id="task-title" name="title" type="text" autocomplete="off">

      <label for="task-priority">Priority</label>
      <select id="task-priority" name="priority">
        <option value="high">High</option>
        <option value="medium" selected>Medium</option>
        <option value="low">Low</option>
      </select>

      <button type="submit">Add task</button>
    </form>

    <section aria-labelledby="tasks-heading">
      <h2 id="tasks-heading">Tasks</h2>
      <label for="search">Search tasks</label>
      <input id="search" type="search" autocomplete="off">
      <ul id="task-list"></ul>
    </section>

  <section aria-labelledby="suggestions-heading">
  <h2 id="suggestions-heading">Suggestions</h2>
  <button type="button" id="load-suggestions">Load suggestions</button>
  <p id="suggestions-status" role="status" aria-live="polite"></p>
  <ul id="suggestions-list"></ul>
</section> 
 <p id="status" role="status" aria-live="polite"></p>
  </main>

  <script src="src/app.js" defer></script>
</body>
</html>
<div id="filters" role="group" aria-label="Filter tasks">
  <button type="button" data-filter="all" aria-pressed="true">All</button>
  <button type="button" data-filter="open" aria-pressed="false">Open</button>
  <button type="button" data-filter="completed" aria-pressed="false">Completed</button>
</div>
<input id="task-title" name="title" type="text" autocomplete="off"
       aria-describedby="title-error">
<p id="title-error" class="error" role="alert"></p>
   <script src="src/api.js"></script>
   <script src="src/app.js"></script>
